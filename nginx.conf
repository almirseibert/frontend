# Configuração do servidor Nginx para servir a SPA React

server {
  # O Nginx vai escutar na porta 80 dentro do contêiner
  listen 80;

  # Define a pasta raiz onde os arquivos da SPA estão
  # Corresponde ao destino do 'COPY' no Dockerfile
  root /usr/share/nginx/html;

  # Define o arquivo de entrada principal
  index index.html index.htm;

  # --- A DIRETIVA MAIS IMPORTANTE PARA SPAs ---
  # Tenta encontrar o arquivo solicitado ($uri)
  # Se for um diretório, tenta servir ($uri/)
  # Se falhar (ex: /veiculos), ele serve o /index.html
  # Isso permite que o React Router (no frontend) assuma o controle da rota.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Opcional: Melhora o cache para arquivos estáticos
  location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|json)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000";
  }

  # Opcional: Habilita compressão Gzip para performance
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
