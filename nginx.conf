# Configuração do servidor Nginx para servir a SPA React (frotamak.com)

# --- IP real do cliente (atrás de Cloudflare + proxy do Easypanel) ---
# Sem isso, todo request aparece no log como 10.11.0.4 (o proxy interno).
# Confiamos na rede interna do Docker/Easypanel e nas faixas do Cloudflare,
# e resolvemos o IP verdadeiro a partir do cabeçalho X-Forwarded-For.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
# Faixas IPv4 do Cloudflare (https://www.cloudflare.com/ips/)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# Faixas IPv6 do Cloudflare
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
  # O Nginx vai escutar na porta 80 dentro do contêiner
  listen 80;

  # Define a pasta raiz onde os arquivos da SPA estão
  # Corresponde ao destino do 'COPY' no Dockerfile
  root /usr/share/nginx/html;

  # Define o arquivo de entrada principal
  index index.html index.htm;

  # --- Bloqueio de varredura de bots ---
  # O site é um build estático React: não existe PHP, WordPress, .env ou .git aqui.
  # Sem estas regras, o fallback da SPA devolvia 200 (index.html) para QUALQUER
  # caminho — inclusive /.env, /wp-login.php, /.git/config — fazendo os scanners
  # "acharem" que encontraram algo e insistirem. Devolvemos 404 real e calamos o log.
  location ~* /\.(env|git|aws|azure|boto|gitconfig) {
    log_not_found off;
    access_log off;
    return 404;
  }
  location ~* \.(php|phtml|asp|aspx|jsp|cgi|yml|yaml|ini|bak|old|sql)$ {
    log_not_found off;
    access_log off;
    return 404;
  }
  location ~* ^/(wp-|xmlrpc|wordpress|plesk-stat|phpinfo|wp-admin|wp-content|wp-includes) {
    log_not_found off;
    access_log off;
    return 404;
  }

  # favicon.ico já existe no build; se faltar, não polui o error.log
  location = /favicon.ico {
    log_not_found off;
    access_log off;
  }

  # --- A DIRETIVA MAIS IMPORTANTE PARA SPAs ---
  # Tenta encontrar o arquivo solicitado ($uri)
  # Se for um diretório, tenta servir ($uri/)
  # Se falhar (ex: /veiculos), ele serve o /index.html
  # Isso permite que o roteamento (no frontend) assuma o controle da rota.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Opcional: Melhora o cache para arquivos estáticos
  location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|json)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000";
  }

  # Opcional: Habilita compressão Gzip para performance
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
