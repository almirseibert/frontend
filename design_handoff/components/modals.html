<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Roboto', sans-serif; background: rgba(0,0,0,0.45); padding: 20px; display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.modal { background: #fff; border-radius: 12px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35); overflow: hidden; width: 340px; }
.modal-header { padding: 16px 18px 12px; border-bottom: 1px solid #f0ebe3; display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-size: 15px; font-weight: 700; color: #1e1a14; }
.modal-title-sub { font-size: 11px; color: #9a8a78; margin-top: 2px; }
.btn-close { background: transparent; border: none; color: #b0a090; cursor: default; padding: 4px; border-radius: 5px; display: flex; align-items: center; justify-content: center; }
.modal-body { padding: 16px 18px; }
.field { margin-bottom: 12px; }
label { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #6a5e4e; margin-bottom: 4px; }
input, select { width: 100%; padding: 8px 10px; border: 1px solid #e8e0d4; border-radius: 8px; background: #faf9f7; font-family: 'Roboto', sans-serif; font-size: 13px; color: #3d3528; outline: none; }
input:focus { border-color: #9E7A42; box-shadow: 0 0 0 3px rgba(158,122,66,0.2); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-footer { padding: 12px 18px; border-top: 1px solid #f0ebe3; display: flex; justify-content: flex-end; gap: 8px; }
.btn { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: default; border: none; font-family: 'Roboto', sans-serif; }
.btn-cancel { background: #fff; border: 1px solid #e8e0d4; color: #6a5e4e; }
.btn-confirm { background: #9E7A42; color: #fff; }
.btn-delete { background: #b03828; color: #fff; }

/* Modal de confirmação de exclusão */
.modal-danger .modal-header { border-bottom-color: #fdf0ec; }
.warn-icon { width: 44px; height: 44px; border-radius: 50%; background: #fdf0ec; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head><body>

<!-- Modal de formulário -->
<div class="modal">
  <div class="modal-header">
    <div>
      <div class="modal-title">Novo Abastecimento</div>
      <div class="modal-title-sub">Registrar abastecimento de frota</div>
    </div>
    <button class="btn-close"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
  <div class="modal-body">
    <div class="field">
      <label>Veículo</label>
      <select><option>Retroescavadeira RE-001 — ABC-1D23</option></select>
    </div>
    <div class="grid2">
      <div class="field">
        <label>Data</label>
        <input type="text" value="29/05/2026">
      </div>
      <div class="field">
        <label>Hodômetro</label>
        <input type="text" value="45.230" style="font-family:'Roboto Mono',monospace;">
      </div>
    </div>
    <div class="grid2">
      <div class="field">
        <label>Litros</label>
        <input type="text" placeholder="0,00">
      </div>
      <div class="field">
        <label>Valor Total (R$)</label>
        <input type="text" placeholder="R$ 0,00">
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-cancel">Cancelar</button>
    <button class="btn btn-confirm">Registrar</button>
  </div>
</div>

<!-- Modal de confirmação de exclusão -->
<div class="modal modal-danger" style="width:300px;">
  <div class="modal-header">
    <div class="modal-title" style="color:#b03828;">Excluir Veículo</div>
    <button class="btn-close"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
  <div class="modal-body">
    <div class="warn-icon">
      <svg viewBox="0 0 24 24" style="color:#b03828;width:22px;height:22px;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </div>
    <p style="font-size:13px;color:#6a5e4e;line-height:1.5;">Tem certeza que deseja excluir permanentemente o veículo <strong>RE-001 — ABC-1D23</strong>?</p>
    <p style="font-size:11px;color:#b0a090;margin-top:8px;">Esta ação não poderá ser desfeita.</p>
  </div>
  <div class="modal-footer">
    <button class="btn btn-cancel">Cancelar</button>
    <button class="btn btn-delete">Excluir</button>
  </div>
</div>

</body></html>
