<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Roboto', sans-serif; background: #f5f3ef; padding: 20px; }
.section { margin-bottom: 18px; }
.section-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #b0a090; margin-bottom: 10px; }
.grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; }
label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #6a5e4e; }
input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #e8e0d4; border-radius: 8px; background: #faf9f7; font-family: 'Roboto', sans-serif; font-size: 13px; color: #3d3528; outline: none; }
input:focus, select:focus { border-color: #9E7A42; box-shadow: 0 0 0 3px rgba(158,122,66,0.2); background: #fff; }
input::placeholder { color: #b0a090; }
.input-wrap { position: relative; }
.input-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: #b0a090; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.input-wrap input { padding-left: 30px; }
.input-error { border-color: #b03828 !important; }
.error-msg { font-size: 11px; color: #b03828; }
.toggle-wrap { display: flex; align-items: center; gap: 8px; }
.toggle { position: relative; width: 36px; height: 20px; cursor: pointer; }
.toggle input { opacity: 0; width: 0; height: 0; }
.slider-tog { position: absolute; inset: 0; background: #d4c8b8; border-radius: 20px; transition: 0.2s; }
.slider-tog:before { content: ''; position: absolute; height: 14px; width: 14px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.2s; }
.toggle input:checked + .slider-tog { background: #9E7A42; }
.toggle input:checked + .slider-tog:before { transform: translateX(16px); }
.tog-label { font-size: 13px; color: #6a5e4e; font-weight: 500; }
</style>
</head><body>

<div class="section">
  <div class="section-title">Inputs & Campos</div>
  <div class="grid">
    <div class="field">
      <label>Nome do Veículo</label>
      <input type="text" value="Retroescavadeira RE-001">
    </div>
    <div class="field">
      <label>Placa</label>
      <input type="text" placeholder="AAA-0A00" style="font-family:'Roboto Mono',monospace;letter-spacing:0.05em;">
    </div>
    <div class="field">
      <label>Status</label>
      <select>
        <option>Disponível</option>
        <option>Em Obra</option>
        <option>Em Manutenção</option>
        <option>Inativo</option>
      </select>
    </div>
    <div class="field">
      <label>Buscar veículo</label>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Buscar por nome ou placa…">
      </div>
    </div>
    <div class="field">
      <label>Hodômetro Atual</label>
      <input type="text" value="45.230" style="font-family:'Roboto Mono',monospace;">
    </div>
    <div class="field">
      <label>Data de Vencimento</label>
      <input type="text" placeholder="dd/mm/aaaa" class="input-error">
      <span class="error-msg">Campo obrigatório.</span>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-title">Toggles</div>
  <div style="display:flex;gap:20px;align-items:center;">
    <div class="toggle-wrap">
      <label class="toggle"><input type="checkbox" checked><span class="slider-tog"></span></label>
      <span class="tog-label">Ativo</span>
    </div>
    <div class="toggle-wrap">
      <label class="toggle"><input type="checkbox"><span class="slider-tog"></span></label>
      <span class="tog-label">Inativo</span>
    </div>
    <div class="toggle-wrap">
      <label class="toggle"><input type="checkbox" checked><span class="slider-tog"></span></label>
      <span class="tog-label">Notificações</span>
    </div>
  </div>
</div>

</body></html>
